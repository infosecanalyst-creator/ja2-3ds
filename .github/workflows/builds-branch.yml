name: build-3dsx
# Builds the 3DS binary and publishes it to the `builds` branch (3dsx + logs + SOURCE_COMMIT)
# so it can be fetched without a local PC build.
on:
  push:
    branches: ["**", "!builds"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container build
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e OUT=/w/out -e WORK=/tmp/ja2w devkitpro/devkitarm bash -ec '
            apt-get update -qq && apt-get install -y -qq git cmake ninja-build python3 python3-pil fonts-dejavu-core curl ca-certificates build-essential libclang-dev >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly -c rust-src
            export PATH=$HOME/.cargo/bin:$PATH
            bash 3ds/build-3ds.sh' 2>&1 | tee build.log
          test -f out/ja2.3dsx
      - name: Collect
        if: always()
        run: |
          sudo chown -R "$USER" . || true
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/SOURCE_COMMIT
      - name: Publish to builds branch
        if: success()   # never replace the last good build with a failed one; failed-build logs stay in the Actions run
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
